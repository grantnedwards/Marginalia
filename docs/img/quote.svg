<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14">
  <rect width="680" height="330" rx="10" fill="#313338"/>
  <rect x="0" y="0" width="680" height="40" rx="10" fill="#2b2d31"/>
  <rect x="0" y="20" width="680" height="20" fill="#2b2d31"/>
  <text x="18" y="26" fill="#949ba4" font-size="15" font-weight="600"># florilegium</text>
  <text x="140" y="26" fill="#6d6f78" font-size="13">you have read to chapter 12</text>

  <!-- slash line -->
  <text x="64" y="60" fill="#949ba4" font-size="12"><tspan fill="#dbdee1" font-weight="600">wren</tspan> used <tspan fill="#00a8fc" font-weight="600">/quote</tspan>  query: far better thing</text>

  <!-- ALLOWED (left) -->
  <circle cx="34" cy="92" r="18" fill="#5865f2"/>
  <text x="34" y="98" text-anchor="middle" fill="#fff" font-weight="700" font-size="16">M</text>
  <text x="64" y="88" fill="#f2f3f5" font-weight="600" font-size="15">Marginalia</text>
  <rect x="162" y="76" width="34" height="16" rx="4" fill="#5865f2"/>
  <text x="179" y="88" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">APP</text>

  <rect x="64" y="100" width="300" height="150" rx="6" fill="#2b2d31"/>
  <rect x="64" y="100" width="4" height="150" rx="2" fill="#1f8b8b"/>
  <text x="82" y="122" fill="#dbdee1" font-size="12">A Tale of Two Cities by Charles Dickens -</text>
  <text x="82" y="138" fill="#dbdee1" font-size="12">ch. 45 "The Footsteps Die Out For Ever",</text>
  <text x="82" y="154" fill="#dbdee1" font-size="12">para 62 (~98% through)</text>
  <!-- spoiler bar -->
  <rect x="82" y="164" width="268" height="46" rx="4" fill="#202225"/>
  <text x="216" y="183" text-anchor="middle" fill="#6d6f78" font-size="12" font-style="italic">spoiler -- tap to reveal</text>
  <text x="216" y="200" text-anchor="middle" fill="#3f4147" font-size="11">||It is a far, far better thing that I do...||</text>
  <text x="82" y="236" fill="#949ba4" font-size="11">A Tale of Two Cities by Charles Dickens</text>
  <text x="64" y="272" fill="#949ba4" font-size="11">&#128065; Only you can see this</text>
  <text x="64" y="300" fill="#57f287" font-size="12" font-weight="600">finished the book: allowed</text>
  <text x="64" y="316" fill="#6d6f78" font-size="11">citation outside the bar, so you decide before you reveal</text>

  <!-- REFUSED (right) -->
  <text x="400" y="60" fill="#949ba4" font-size="12"><tspan fill="#dbdee1" font-weight="600">jun</tspan> used <tspan fill="#00a8fc" font-weight="600">/quote</tspan>  query: far better thing</text>
  <circle cx="370" cy="92" r="18" fill="#5865f2"/>
  <text x="370" y="98" text-anchor="middle" fill="#fff" font-weight="700" font-size="16">M</text>
  <text x="400" y="88" fill="#f2f3f5" font-weight="600" font-size="15">Marginalia</text>
  <rect x="498" y="76" width="34" height="16" rx="4" fill="#5865f2"/>
  <text x="515" y="88" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">APP</text>
  <rect x="400" y="100" width="260" height="52" rx="6" fill="#2b2d31"/>
  <rect x="400" y="100" width="4" height="52" rx="2" fill="#1f8b8b"/>
  <text x="418" y="132" fill="#dbdee1" font-size="13">Nothing I can show you matches that.</text>
  <text x="400" y="176" fill="#949ba4" font-size="11">&#128065; Only you can see this</text>
  <text x="400" y="300" fill="#ed4245" font-size="12" font-weight="600">on chapter 12: refused</text>
  <text x="400" y="316" fill="#6d6f78" font-size="11">no title, no count, no echo of the question</text>
</svg>
